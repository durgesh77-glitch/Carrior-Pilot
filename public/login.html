<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerPath AI — Sign in</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152238;background:#f5f8fc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border:1px solid #e4eaf2;border-radius:24px;padding:36px;box-shadow:0 18px 55px rgba(22,42,68,.10)}
.brand{font-size:22px;font-weight:800;letter-spacing:-.02em}.brand span{color:#315efb}
h1{font-size:30px;letter-spacing:-.03em;margin:34px 0 10px}.muted{color:#66758a;line-height:1.6}
label{display:block;font-size:13px;font-weight:700;margin:22px 0 8px}input{width:100%;padding:14px 15px;border:1px solid #d7deea;border-radius:12px;font:inherit;outline:none}input:focus{border-color:#315efb;box-shadow:0 0 0 4px rgba(49,94,251,.08)}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#315efb;color:#fff;font-weight:800;font-size:15px;cursor:pointer}button.secondary{background:#eef3ff;color:#315efb}.hidden{display:none}.error{margin-top:14px;color:#b42318;font-size:13px}
.note{font-size:12px;color:#8793a5;margin-top:20px}
</style></head>
<body>
<div class="card">
  <div class="brand">CareerPath <span>AI</span></div>
  <h1>Build a career plan that fits you.</h1>
  <p class="muted">Sign in with your email. We’ll send a one-time code—no password to remember.</p>
  <form id="loginForm">
    <label>Email address</label>
    <input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com">
    <div id="codeWrap" class="hidden">
      <label>Verification code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
    </div>
    <button id="submitBtn" type="submit">Continue</button>
    <button id="backBtn" type="button" class="secondary hidden">Use another email</button>
  </form>
  <div id="error" class="error"></div>
  <div class="note">Your career profile is private to your account.</div>
</div>
<script>
const A=window.hatchable.auth;
const form=document.getElementById('loginForm'), emailEl=document.getElementById('email'), codeEl=document.getElementById('code');
const codeWrap=document.getElementById('codeWrap'), submitBtn=document.getElementById('submitBtn'), backBtn=document.getElementById('backBtn'), err=document.getElementById('error');
let step='email',hasPasskey=false;
(async()=>{const s=await A.getSession();if(s?.user) location.replace(new URLSearchParams(location.search).get('next')||'/');})();
form.addEventListener('submit',async e=>{
 e.preventDefault();err.textContent='';
 try{
  if(step==='email'){
   const r=await A.startLogin({email:emailEl.value.trim()}); hasPasskey=!!r.has_passkey;
   if(hasPasskey&&A.supportsPasskeys()){try{const done=await A.signInWithPasskey({email:emailEl.value.trim()});if(done?.user){go();return;}}catch{}}
   step='code'; codeWrap.classList.remove('hidden'); codeEl.focus(); backBtn.classList.remove('hidden'); submitBtn.textContent='Verify code';
  }else{
   await A.verifyCode({email:emailEl.value.trim(),code:codeEl.value.trim()});go();
  }
 }catch(x){err.textContent=x?.message||'Unable to sign in. Please try again.'}
});
backBtn.addEventListener('click',()=>{step='email';codeWrap.classList.add('hidden');backBtn.classList.add('hidden');submitBtn.textContent='Continue';codeEl.value='';err.textContent=''});
function go(){const next=new URLSearchParams(location.search).get('next');location.replace(next&&next.startsWith('/')?next:'/')}
</script></body></html>
